<!-- 悬浮的 AI 助手按钮 -->
<div id="ai-assistant-btn" onclick="toggleAiChat()" style="position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; background: linear-gradient(135deg, #8b5cf6, #3b82f6); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 10px 20px rgba(139, 92, 246, 0.4); z-index: 9999; transition: transform 0.3s;">
    <svg width="30" height="30" fill="white" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12c0 1.76.46 3.41 1.28 4.84L2 22l5.16-1.28C8.59 21.54 10.24 22 12 22c5.52 0 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
</div>

<!-- AI 聊天窗口 -->
<div id="ai-chat-window" style="position: fixed; bottom: 100px; right: 30px; width: 350px; height: 450px; background: white; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); z-index: 9998; display: none; flex-direction: column; overflow: hidden; border: 1px solid #e5e7eb;">
    <!-- 头部 -->
    <div style="background: linear-gradient(135deg, #8b5cf6, #3b82f6); color: white; padding: 15px 20px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
        <span>✨ 栗丽婧的 AI 助理</span>
        <span onclick="toggleAiChat()" style="cursor: pointer; font-size: 1.2rem;">&times;</span>
    </div>
    <!-- 消息区 -->
    <div id="ai-chat-messages" style="flex: 1; padding: 20px; overflow-y: auto; background: #f9fafb; display: flex; flex-direction: column; gap: 15px; font-size: 0.9rem;">
        <div style="background: white; padding: 10px 15px; border-radius: 12px; border-bottom-left-radius: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 85%;">
            您好！我是栗丽婧的 AI 助理。HR 想了解关于她的优势、项目经历或技能，可以直接问我哦！
        </div>
        <!-- 快捷问题 -->
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <span onclick="askPreset('她的核心竞争力是什么？')" style="background: #e0e7ff; color: #4f46e5; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; cursor: pointer;">核心竞争力</span>
            <span onclick="askPreset('她最成功的项目是哪个？')" style="background: #e0e7ff; color: #4f46e5; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; cursor: pointer;">最成功的项目</span>
        </div>
    </div>
    <!-- 输入区 -->
    <div style="padding: 15px; border-top: 1px solid #e5e7eb; display: flex; gap: 10px; background: white;">
        <input type="text" id="ai-chat-input" placeholder="输入您的问题..." style="flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 20px; outline: none;" onkeypress="if(event.key==='Enter') sendAiMessage()">
        <button onclick="sendAiMessage()" style="background: #8b5cf6; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center;">↑</button>
    </div>
</div>

<script>
    // 开关窗口
    function toggleAiChat() {
        const win = document.getElementById('ai-chat-window');
        win.style.display = win.style.display === 'none' ? 'flex' : 'none';
        document.getElementById('ai-assistant-btn').style.transform = win.style.display === 'flex' ? 'scale(0.9)' : 'scale(1)';
    }

    // 预设问题点击
    function askPreset(q) {
        document.getElementById('ai-chat-input').value = q;
        sendAiMessage();
    }

    // 核心模拟逻辑（你可以把这里替换成真实的智谱API fetch请求）
    function sendAiMessage() {
        const input = document.getElementById('ai-chat-input');
        const msg = input.value.trim();
        if(!msg) return;
        
        const chatBox = document.getElementById('ai-chat-messages');
        
        // 显示用户问题
        chatBox.innerHTML += `<div style="background: #8b5cf6; color: white; padding: 10px 15px; border-radius: 12px; border-bottom-right-radius: 0; align-self: flex-end; max-width: 85%;">${msg}</div>`;
        input.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        // 显示加载中
        const loadingId = 'loading-' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" style="background: white; padding: 10px 15px; border-radius: 12px; border-bottom-left-radius: 0; max-width: 85%; color: #6b7280;">正在思考...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        // 模拟AI思考延迟
        setTimeout(() => {
            let reply = "";
            if(msg.includes('核心') || msg.includes('优势')) {
                reply = "栗丽婧的核心优势在于<b>“懂业务的数据分析能力”</b>。她不仅在华发集团、禾和时尚等实习中积累了扎实的 SQL/Python 数据处理经验，能独立搭建业务看板，还具备经济学宏观视角，能从数据中洞察商业逻辑。";
            } else if(msg.includes('项目')) {
                reply = "她最具代表性的项目是<b>“Sober”疲劳驾驶检测系统</b>。她作为商业与财务负责人，完成了 PEST 分析、商业画布构建，并预测了未来五年的财务模型，最终帮助团队斩获 iCAN 省一等奖。此外，她还独立创立了鲜花品牌，实现了 86% 的高复购率。";
            } else if(msg.includes('数据') || msg.includes('技能')) {
                reply = "她熟练掌握 <b>Excel、SQL、Python (Pandas) 和 SPSS</b>。例如在禾和时尚实习时，她曾使用 SQL 清洗了 10 万条交易流水；在三下乡调研中，她运用 SPSS 构建了结构方程模型和 Logit 模型进行深度分析。";
            } else {
                reply = "这是一个好问题！如果想了解她的具体经历，建议直接点击网页上的“下载简历”查看完整版，或者直接发送邮件至 LiLijing0128@163.com 与她联系。";
            }
            
            document.getElementById(loadingId).outerHTML = `<div style="background: white; padding: 10px 15px; border-radius: 12px; border-bottom-left-radius: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.05); max-width: 85%; line-height: 1.5;">${reply}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
    }
</script>
